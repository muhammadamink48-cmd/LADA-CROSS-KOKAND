<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LADA Priora Zapchastlari (300 xil zapchast)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; padding: 20px; }
        .lada-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: #fff; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; }
        .lada-top-center a { margin: 0 10px; color: #007bff; text-decoration: none; font-weight: bold; }
        .lada-top-right button { padding: 8px 16px; background: #dc3545; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .search-container { width: 100%; margin-bottom: 20px; }
        .search-container input { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        .parts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background-color: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
        .card h3 { font-size: 14px; margin: 10px 0 6px; color: #333; min-height: 38px; }
        .card .stock { font-size: 13px; color: #28a745; font-weight: bold; margin-bottom: 10px; background-color: #e8f5e9; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .buy-btn { display: inline-block; border: none; cursor: pointer; background-color: #28a745; color: #fff; padding: 10px 15px; border-radius: 5px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <div class="lada-header">
        <h2>LADA Priora Zapchastlari (300 xil zapchast)</h2>
        <div class="lada-top-center">
            <a href="https://t.me/telegram" target="_blank">Telegram</a>
            <a href="tel:+998901234567">Telefon</a>
        </div>
        <div class="lada-top-right">
            <button onclick="window.location.href='index.html'">Yopish</button>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterParts()" placeholder="Zapchast nomi bo'yicha qidiruv...">
    </div>

    <div class="parts-grid" id="partsGrid"></div>

    <!-- MODAL OYNA -->
    <div class="modal-overlay" id="orderModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000;">
        <div class="modal-content" style="background:#fff; width:90%; max-width:450px; border-radius:12px; padding:25px; box-shadow:0 5px 15px rgba(0,0,0,0.3); position:relative; max-height:90vh; overflow-y:auto;">
            <button type="button" class="close-modal" onclick="closeOrderModal()" style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; border:none; background:none;">&times;</button>
            <h3 id="modalTitle" style="margin-bottom:15px; text-align:center;">Buyurtma rasmiylashtirish</h3>
            
            <div class="delivery-options" style="display:flex; gap:10px; margin-bottom:15px;">
                <button type="button" class="option-btn active" id="btnPickup" onclick="selectType('pickup')" style="flex:1; padding:10px; border:2px solid #007bff; background:#007bff; color:#fff; border-radius:6px; font-weight:bold; cursor:pointer;">O'zim olib ketaman</button>
                <button type="button" class="option-btn" id="btnDelivery" onclick="selectType('delivery')" style="flex:1; padding:10px; border:2px solid #007bff; background:#fff; color:#007bff; border-radius:6px; font-weight:bold; cursor:pointer;">Yetkazib berish</button>
            </div>

            <form id="orderForm" onsubmit="handleOrderSubmit(event)">
                <div class="form-group" style="margin-bottom:12px; text-align:left;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">Ism:</label>
                    <input type="text" id="custName" required placeholder="Ismingizni kiriting" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
                </div>
                <div class="form-group delivery-only" style="margin-bottom:12px; text-align:left; display:none;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">Familiya:</label>
                    <input type="text" id="custSurname" placeholder="Familiyangizni kiriting" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
                </div>
                <div class="form-group" style="margin-bottom:12px; text-align:left;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">Telefon raqam:</label>
                    <input type="tel" id="custPhone" required placeholder="+998901234567" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
                </div>
                <div class="form-group delivery-only" style="margin-bottom:12px; text-align:left; display:none;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">Email:</label>
                    <input type="email" id="custEmail" placeholder="example@mail.com" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
                </div>
                <div class="form-group delivery-only" style="margin-bottom:12px; text-align:left; display:none;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">Plastik karta raqami:</label>
                    <input type="text" id="custCard" placeholder="8600 **** **** ****" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
                </div>
                <div class="form-group delivery-only" style="margin-bottom:12px; text-align:left; display:none;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">To'lov cheki (Rasm):</label>
                    <input type="file" id="custReceipt" accept="image/*" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;">
                </div>

                <button type="submit" style="width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:10px;">Buyurtmani tasdiqlash</button>
            </form>
        </div>
    </div>

    <script>
        const rawPartNames = [
            "Oldi Amortizator Stoyka 2170 Chap", "Oldi Amortizator Stoyka 2170 O'ng", "Orqa Amortizator 2170 SS20", "Opordyy Podshipnik 2170 Priora",
            "Prujina Oldi Priora 2170", "Prujina Orqa Priora", "Oldi Tormoz Kolodka 2110-2170", "Orqa Tormoz Kolodka 2108-2170",
            "Tormoz Diski Ventilyatsiyali R14", "Baraban Tormoz Orqa Alyumin", "Sharavoy Opora 2110 Reinforced", "Rulevoy Tyaga 2170 EUR",
            "Rulevoy Nakonechnik 2110 Chap", "Rulevoy Nakonechnik 2110 O'ng", "Stabilizator Stoyka Yachika 2170", "Stabilizator Vtulka Polyurethan",
            "Rychag Oldi Trehugolny 2170", "Saylentblok Rychag 2110", "Pylnik SHRUS Silicon Red", "SHRUS Tashqi 2170 ABS",
            "SHRUS Ichki 2170 Trioid", "Moy Filtri 2108-2170", "Havo Filtri 2112 Panel", "Salon Filtri Priora 2170 (Klima)",
            "Yoqilg'i Filtri Bystros'yom", "Svecha Zajiganiya 16V 2112", "Katushka Zajiganiya Individ 2112", "GRM Kamar Gates 21126",
            "GRM Rolik Netyajnoy INA 21126", "GRM Rolik Obvodnoy INA", "Generator Kamar 6PK Priora Konditsioner", "Suv Pompasi TZA Premium 21126",
            "Termostat 21082-2170 Komplekt", "Radiator Dvigatel Priora 2170", "Radiator Konditsioner Panasonic/Halla", "Pechka Radiator 2170",
            "Ventilyator Radiator Dual", "Pechka Motor 2170 Halla", "Glushitel Rezonator 2170 Bez Vstavki", "Glushitel Orqa Priora Sedan/Hatchback",
            "Pauk Exhaust 4-2-1 2170", "Lyambda Zond Bosch 2170", "GBL Prokladka Metall 21116/21126", "Klapannaya Kryshka Prokladka Silicon",
            "Porshen Federal Mogul 82.0", "Porshen Koltso Prima 82.0", "Shatun Priora 21126 Oblegchyonny", "Vkladish Shatun 21126 STD",
            "Vkladish Korennoy 2108 STD", "Kolenval 2112", "Salnik Kolenval Oldi Victor Reinz", "Salnik Kolenval Orqa Victor Reinz",
            "Rasspredval 21126 Vpusk", "Rasspredval 21126 Vypusk", "Gidrokompensator INA 2112", "Klapan Vpusk 21126 Set",
            "Klapan Vypusk 21126 Set", "Maslyanoy Nasos 2112", "Karter Poddon 2108 Shatny", "Podushka Dvigatel Prava 2170",
            "Podushka Dvigatel Leva 2170", "Podushka Dvigatel Gitara 2170", "Datchik Kolenval 2112", "Datchik Rasspredval 2112",
            "Datchik Detonatsii 18.3855", "Datchik Davleniya Masla 2108", "Datchik Temperatury 21083", "Datchik ABS Oldi Priora",
            "Datchik ABS Orqa Priora", "Drosselnaya Zaslonka E-Gas 21126", "Forsunka Toplivnaya Bosch 0280158022", "Benzonasos Modul 2170",
            "Vakuumny Usilitel Tormozov Sport 2170", "Glavny Tormoznoy Tsilindr 2170", "Support Oldi Chap 2112 R14", "Support Oldi O'ng 2112 R14",
            "Ruchnik Tross 2170 Set", "Rulevaya Reyka EUR Priora 3.1 Oborota", "EUR Blok Upravleniya 2170", "Stsepleniye Komplekt LUK 2170",
            "Vyzhimnoy Podshipnik 2112", "Mahovik 21126", "KPP Salnik Pervichny Val 2108", "KPP Salnik Privod 2108",
            "Generator 115A Priora", "Starter 2112 Reduction", "Akumulyator 60Ah 540A", "Zamok Zajiganiya 2170 Klyuch CHip",
            "Fara Oldi Chap Priora 2", "Fara Oldi O'ng Priora 2", "Protivotumannaya Fara Salma LED", "Fonar Orqa LED Priora Sedan",
            "Dvornik Motor 2170", "Kapot Priora 2170", "Krylo Oldi Chap 2170", "Bamper Oldi Priora 2 SE",
            "Bamper Orqa Priora 2", "Dver Oldi Chap 2170", "Dver Oldi O'ng 2170", "Steklopodyomnik Reekny 2170",
            "Lobovoye Steklo Obogrev Priora", "Zerkalo SE Style Elektro", "Torpeda Panel 2170 SE", "Airbag Rul Priora 2",
            "Konditsioner Kompressor Halla/Panasonic", "Disk R14 Toros Alyumin", "Zashchita Kartera Metall 2mm 2170"
        ];

        let expandedPartNames = [];
        for (let i = 0; i < 300; i++) {
            let baseName = rawPartNames[i % rawPartNames.length];
            let suffix = i >= rawPartNames.length ? ` Mod-${Math.floor(i / rawPartNames.length) + 1}` : '';
            expandedPartNames.push(`${baseName}${suffix}`);
        }

        const partsData = expandedPartNames.map((name, index) => ({
            id: index + 1,
            name: `LADA Priora ${name}`,
            stock: 300,
            img: "./images/priora.jpg"
        }));

        function renderParts(data) {
            const grid = document.getElementById('partsGrid');
            grid.innerHTML = "";
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <div class="stock">Soni: <span class="count">${item.stock}</span> ta bor</div>
                    <button class="buy-btn" onclick="openOrder('${item.name.replace(/'/g, "\\'")}', this)">Sotib olish</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterParts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = partsData.filter(item => item.name.toLowerCase().includes(query));
            renderParts(filtered);
        }

        document.addEventListener("DOMContentLoaded", () => renderParts(partsData));

        const BOT_TOKEN = "8853754694:AAFA6rYGa4NHLDSXIwiDc4bP5LJQy6UVHnI"; 
        const ADMIN_CHAT_ID = "8673898827"; 

        let selectedProduct = "";
        let currentStockElement = null;
        let orderType = "pickup";

        function openOrder(productName, btn) {
            const card = btn.closest('.card');
            currentStockElement = card.querySelector('.count');
            let currentStock = parseInt(currentStockElement.textContent);
            if (currentStock <= 0) { alert("Kechirasiz, ushbu mahsulot tugagan!"); return; }
            selectedProduct = productName;
            document.getElementById('modalTitle').textContent = selectedProduct + " - Buyurtma";
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

        function selectType(type) {
            orderType = type;
            const pickupBtn = document.getElementById('btnPickup');
            const deliveryBtn = document.getElementById('btnDelivery');
            const deliveryFields = document.querySelectorAll('.delivery-only');
            if (type === 'pickup') {
                pickupBtn.style.background = '#007bff'; pickupBtn.style.color = '#fff';
                deliveryBtn.style.background = '#fff'; deliveryBtn.style.color = '#007bff';
                deliveryFields.forEach(el => el.style.display = 'none');
            } else {
                deliveryBtn.style.background = '#007bff'; deliveryBtn.style.color = '#fff';
                pickupBtn.style.background = '#fff'; pickupBtn.style.color = '#007bff';
                deliveryFields.forEach(el => el.style.display = 'block');
            }
        }

        async function handleOrderSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            if (currentStockElement) {
                let currentStock = parseInt(currentStockElement.textContent);
                if (currentStock > 0) currentStockElement.textContent = currentStock - 1;
            }
            if (orderType === 'pickup') {
                const msg = `📦 NEW ORDER (O'ZIM OLIB KETAMAN)\nMahsulot: ${selectedProduct}\nIsm: ${name}\nTel: ${phone}`;
                sendTelegramMessage(msg);
                alert("Tasdiqlandi! Buyurtma 1 kun turadi va bekor bo'ladi.");
                closeOrderModal();
            } else {
                const surname = document.getElementById('custSurname').value;
                const email = document.getElementById('custEmail').value;
                const card = document.getElementById('custCard').value;
                const receiptFile = document.getElementById('custReceipt').files[0];
                const msg = `🚚 NEW ORDER (YETKAZIB BERISH)\nMahsulot: ${selectedProduct}\nIsm-Familiya: ${name} ${surname}\nEmail: ${email}\nTel: ${phone}\nKarta: ${card}`;
                if (receiptFile) sendTelegramPhotoWithButton(receiptFile, msg);
                else sendTelegramMessage(msg);
                alert("Buyurtmangiz qabul qilindi! Admin chekni va ma'lumotlarni tekshirib, telefoningizga tasdiqlash kodini yuboradi.");
                closeOrderModal();
            }
        }

        function sendTelegramMessage(text) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: text })
            });
        }

        function sendTelegramPhotoWithButton(file, captionText) {
            const formData = new FormData();
            formData.append('chat_id', ADMIN_CHAT_ID);
            formData.append('photo', file);
            formData.append('caption', captionText);
            const keyboard = { inline_keyboard: [[ { text: "✅ Tasdiqlash (Kod Yuborish)", callback_data: "send_code" } ]] };
            formData.append('reply_markup', JSON.stringify(keyboard));
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }
    </script>
</body>
</html>
