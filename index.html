<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lada Ehtiyot Qismlari Katalogi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #ff6b00;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 35px;
            font-size: 16px;
        }
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .car-card {
            background: #f9f9f9;
            border: 2px solid #eee;
            padding: 25px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .car-card:hover {
            border-color: #ff6b00;
            background: #fff5ee;
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(255, 107, 0, 0.15);
            color: #ff6b00;
        }
        .car-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚗 Lada Ehtiyot Qismlari Katalogi</h1>
    <p>Kerakli avtomobil modelini tanlang va 300 ta ehtiyot qism narxlarini boshqaring:</p>

    <div class="car-grid">
        <a href="chevrolet_niva.html" class="car-card">
            <span class="car-icon">🚙</span>
            Chevrolet Niva
        </a>
        <a href="niva_urban.html" class="car-card">
            <span class="car-icon">🚙</span>
            Niva Urban
        </a>
        <a href="kalina.html" class="car-card">
            <span class="car-icon">🚗</span>
            Lada Kalina
        </a>
        <a href="samara.html" class="car-card">
            <span class="car-icon">🚗</span>
            Lada Samara (2114/2115)
        </a>
        <a href="2107.html" class="car-card">
            <span class="car-icon">🚘</span>
            Lada 2107
        </a>
        <a href="2106.html" class="car-card">
            <span class="car-icon">🚘</span>
            Lada 2106
        </a>
        <a href="2104.html" class="car-card">
            <span class="car-icon">🚐</span>
            Lada 2104
        </a>
        <a href="2103.html" class="car-card">
            <span class="car-icon">🚘</span>
            Lada 2103
        </a>
        <a href="2101.html" class="car-card">
            <span class="car-icon">🚘</span>
            Lada 2101 (Kopeyka)
        </a>
    </div>
</div>

</body>
</html>
